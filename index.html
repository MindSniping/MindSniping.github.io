<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geometry Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg-top: #0a1650;
    --bg-bottom: #1b34b8;
    --tile: rgba(255, 255, 255, 0.07);
    --line: rgba(255, 255, 255, 0.16);
    --text: #f4f7ff;
    --muted: #aebbe8;
    --star: #ffd23f;
    --moon: #7fe9ff;
    --diamond: #4cc9ff;
    --secret: #ffb800;
    --user: #d5deee;
    --demon: #ff5a5a;
    --display: "Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
    --body: "Nunito", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    font-family: var(--body);
    color: var(--text);
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
    background-attachment: fixed;
    padding: max(24px, env(safe-area-inset-top)) 20px max(40px, env(safe-area-inset-bottom));
  }
  main { max-width: 760px; margin: 0 auto; }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(2.4rem, 8vw, 4rem);
    line-height: 1;
    margin: 32px 0 8px;
    letter-spacing: 0.01em;
    text-shadow: 0 4px 0 rgba(0, 0, 0, 0.35);
  }
  .intro { color: var(--muted); margin: 0 0 28px; max-width: 52ch; line-height: 1.5; }

  .hero {
    display: flex; align-items: center; gap: 20px;
    background: var(--tile);
    border: 3px solid var(--star);
    border-radius: 6px;
    padding: 22px 24px;
    box-shadow: 0 6px 0 rgba(0, 0, 0, 0.35);
    margin-bottom: 16px;
  }
  .hero svg { width: 72px; height: 72px; flex: none; }
  .hero .num { font-family: var(--display); font-size: clamp(3rem, 12vw, 5.5rem); line-height: 1; color: var(--star); }
  .hero .label { color: var(--muted); font-size: 1.05rem; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
  .tile {
    background: var(--tile);
    border: 2px solid var(--line);
    border-bottom: 5px solid var(--accent);
    border-radius: 6px;
    padding: 16px 18px;
    display: flex; align-items: center; gap: 14px;
  }
  .tile svg { width: 40px; height: 40px; flex: none; }
  .tile .num { font-family: var(--display); font-size: 1.9rem; line-height: 1; color: var(--accent); }
  .tile .label { color: var(--muted); font-size: 0.95rem; }

  h2 { font-family: var(--display); font-weight: 400; font-size: 1.6rem; margin: 40px 0 12px; }
  .followers { margin-top: 16px; display: flex; align-items: baseline; gap: 12px; background: var(--tile); border: 2px solid var(--line); border-bottom: 5px solid #b58cff; border-radius: 6px; padding: 16px 18px; }
  .followers .fnum { font-family: var(--display); font-size: 1.9rem; line-height: 1; color: #b58cff; }
  .followers .label { color: var(--muted); }
  #lookup { display: flex; gap: 10px; }
  #lookup input { flex: 1; min-width: 0; font: inherit; font-size: 1rem; color: var(--text); background: rgba(0, 0, 0, 0.3); border: 2px solid var(--line); border-radius: 6px; padding: 12px 14px; }
  #lookup input:focus-visible, #lookup button:focus-visible { outline: 3px solid var(--star); outline-offset: 2px; }
  #lookup button { font-family: var(--display); font-size: 1.05rem; color: #2b2000; background: var(--star); border: 0; border-bottom: 4px solid #b58a00; border-radius: 6px; padding: 0 20px; cursor: pointer; }
  #result { margin-top: 16px; color: var(--muted); }
  .found { background: var(--tile); border: 2px solid var(--line); border-radius: 6px; padding: 16px 18px; color: var(--text); }
  .found h3 { font-family: var(--display); font-weight: 400; font-size: 1.7rem; margin: 0 0 4px; }
  .found .rank { color: var(--muted); margin: 0 0 12px; }
  .found dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 0; }
  .found dt { color: var(--muted); font-size: 0.9rem; }
  .found dd { margin: 0; font-family: var(--display); font-size: 1.4rem; }
  .extra { margin-top: 28px; color: var(--muted); line-height: 1.6; }
  .extra strong { color: var(--text); }
  .updated { margin-top: 24px; font-size: 0.85rem; color: var(--muted); opacity: 0.8; }
</style>
</head>
<body>
<main>
  <h1>Geometry Dash</h1>
  <p class="intro" id="intro"></p>

  <section class="hero" aria-label="Stars">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ffd23f" stroke="#7a5b00" stroke-width="1" d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"/></svg>
    <div>
      <div class="num" data-key="stars">0</div>
      <div class="label">Stars</div>
    </div>
  </section>

  <section class="grid" id="grid" aria-label="Other stats"></section>

  <section class="followers" aria-label="Followers">
    <span class="fnum" id="fcount">0</span>
    <span class="label" id="flabel">Followers</span>
  </section>

  <section aria-label="Player search">
    <h2>Look up a player</h2>
    <form id="lookup">
      <input id="q" type="text" placeholder="Enter a username" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="20" aria-label="Username">
      <button type="submit">Search</button>
    </form>
    <div id="result" aria-live="polite"></div>
  </section>

  <p class="extra" id="extra"></p>
  <p class="updated" id="updated"></p>
</main>

<script>
  /* Stats load live from the API. The numbers below are only a fallback if it's down. */
  const PLAYER = {
    name: "MindSniping",
    intro: "Here's where my Geometry Dash progress stands right now.",
    updated: "November 2026",
    hardestDemon: "Your hardest demon",
    favoriteLevel: "Your favorite level",
    followers: 0,
    followersLabel: "Followers",
    stats: {
      stars: 19817,
      moons: 3300,
      diamonds: 69395,
      secretCoins: 164,
      userCoins: 3662,
      demons: 393,
      creatorPoints: 0
    }
  };
  /* ================================== */

  const ICONS = {
    moons: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#7fe9ff" stroke="#1b6a7a" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>',
    diamonds: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4cc9ff" stroke="#14587a" d="M12 2l8 8-8 12L4 10z"/></svg>',
    secretCoins: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#ffb800" stroke="#7a5200" stroke-width="1.5"/><circle cx="12" cy="12" r="5" fill="none" stroke="#7a5200" stroke-width="1.5"/></svg>',
    userCoins: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="#d5deee" stroke="#5c6a85" stroke-width="1.5"/><circle cx="12" cy="12" r="5" fill="none" stroke="#5c6a85" stroke-width="1.5"/></svg>',
    demons: '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#ff5a5a" stroke="#7a1414" d="M4 3l4 4h8l4-4v9a8 8 0 0 1-16 0z"/><circle cx="9" cy="12" r="1.6" fill="#7a1414"/><circle cx="15" cy="12" r="1.6" fill="#7a1414"/></svg>',
    creatorPoints: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" fill="#b58cff" stroke="#3f2680" stroke-width="1.5"/><path d="M8 12l3 3 5-6" fill="none" stroke="#3f2680" stroke-width="2"/></svg>'
  };
  const TILES = [
    ["moons", "Moons", "var(--moon)"],
    ["diamonds", "Diamonds", "var(--diamond)"],
    ["secretCoins", "Secret coins", "var(--secret)"],
    ["userCoins", "User coins", "var(--user)"],
    ["demons", "Demons beaten", "var(--demon)"],
    ["creatorPoints", "Creator points", "#b58cff"]
  ];

  const fmt = n => n.toLocaleString("en-US");
  document.title = PLAYER.name + " · Geometry Dash";
  document.getElementById("intro").textContent = PLAYER.intro;

  const grid = document.getElementById("grid");
  TILES.forEach(([key, label, color]) => {
    const el = document.createElement("div");
    el.className = "tile";
    el.style.setProperty("--accent", color);
    el.innerHTML = ICONS[key] +
      '<div><div class="num" data-key="' + key + '">0</div><div class="label">' + label + "</div></div>";
    grid.appendChild(el);
  });

  document.getElementById("extra").innerHTML =
    "<strong>Hardest demon:</strong> " + PLAYER.hardestDemon +
    "<br><strong>Favorite level:</strong> " + PLAYER.favoriteLevel;
  document.getElementById("updated").textContent = "Last updated " + PLAYER.updated;

  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  function show(stats) {
    document.querySelectorAll(".num").forEach(el => {
      const target = Number(stats[el.dataset.key]) || 0;
      if (reduce || target === 0) { el.textContent = fmt(target); return; }
      const start = performance.now(), dur = 1200;
      (function tick(now) {
        const t = Math.min((now - start) / dur, 1);
        el.textContent = fmt(Math.round(target * (1 - Math.pow(1 - t, 3))));
        if (t < 1) requestAnimationFrame(tick);
      })(start);
    });
  }

  // Live stats from GDBrowser's community API. If it's down or blocked, the saved numbers above are shown.
  fetch("https://gdbrowser.com/api/profile/" + encodeURIComponent(PLAYER.name))
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(d => {
      if (!d || d.stars === undefined) throw new Error("Player not found");
      show({
        stars: d.stars, moons: d.moons, diamonds: d.diamonds,
        secretCoins: d.coins, userCoins: d.userCoins,
        demons: d.demons, creatorPoints: d.cp
      });
      document.getElementById("updated").textContent = "Live from GDBrowser";
    })
    .catch(() => show(PLAYER.stats));

  // Followers (entered by hand above; GDBrowser doesn't provide this)
  document.getElementById("fcount").textContent = fmt(PLAYER.followers);
  document.getElementById("flabel").textContent = PLAYER.followersLabel;

  // Player search
  const FIELDS = [
    ["stars", "Stars"], ["moons", "Moons"], ["diamonds", "Diamonds"],
    ["coins", "Secret coins"], ["userCoins", "User coins"],
    ["demons", "Demons"], ["cp", "Creator points"]
  ];
  const result = document.getElementById("result");

  document.getElementById("lookup").addEventListener("submit", e => {
    e.preventDefault();
    const name = document.getElementById("q").value.trim();
    if (!name) return;
    result.textContent = "Searching…";
    fetch("https://gdbrowser.com/api/profile/" + encodeURIComponent(name))
      .then(r => (r.ok ? r.json() : null))
      .then(d => {
        result.textContent = "";
        if (!d || d.stars === undefined) {
          result.textContent = "No player named “" + name + "” found.";
          return;
        }
        const card = document.createElement("div");
        card.className = "found";
        const h = document.createElement("h3");
        h.textContent = d.username || name;
        card.appendChild(h);
        if (d.rank > 0) {
          const p = document.createElement("p");
          p.className = "rank";
          p.textContent = "Global rank #" + fmt(d.rank);
          card.appendChild(p);
        }
        const dl = document.createElement("dl");
        FIELDS.forEach(([key, label]) => {
          if (d[key] === undefined) return;
          const box = document.createElement("div");
          const dt = document.createElement("dt");
          dt.textContent = label;
          const dd = document.createElement("dd");
          dd.textContent = fmt(Number(d[key]) || 0);
          box.append(dt, dd);
          dl.appendChild(box);
        });
        card.appendChild(dl);
        result.appendChild(card);
      })
      .catch(() => { result.textContent = "Couldn’t reach GDBrowser. Try again in a moment."; });
  });
</script>
</body>
</html>
